name: Deploy Apps Script Webapp

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build webapp (dist -> apps-script webapp)
        run: npm run build:webapp

      - name: Install clasp
        run: npm i -g @google/clasp

      - name: Write service account creds (supports base64 or raw JSON)
        env:
          GOOGLE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: |
          # If base64 secret provided, decode it; otherwise use raw JSON secret
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_B64" ]; then
            echo "Using base64 secret GOOGLE_SERVICE_ACCOUNT_B64"
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_B64" | base64 --decode > ./gac.json
          elif [ -n "$GOOGLE_SERVICE_ACCOUNT" ]; then
            echo "Using raw JSON secret GOOGLE_SERVICE_ACCOUNT"
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT" > ./gac.json
          else
            echo "ERROR: neither GOOGLE_SERVICE_ACCOUNT_B64 nor GOOGLE_SERVICE_ACCOUNT is set"
            exit 1
          fi
          # validate JSON using node
          node -e "try{JSON.parse(require('fs').readFileSync('./gac.json','utf8')); console.log('gac.json parsed OK')}catch(e){console.error('gac.json invalid JSON:', e.message); process.exit(2)}"

      - name: Login clasp with service account
        run: clasp login --creds ./gac.json

      - name: Push to Apps Script project
        env:
          CLASP_DISABLE_AUTO_UPDATE: 'true'
        run: npx clasp push --rootDir scripts/apps-script/webapp

      - name: Create version and update deployment
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/apps-script/ci-deploy.mjs

      - name: Export webapp URL
        if: always()
        run: |
          if [ -f webapp-url.txt ]; then
            echo "WEBAPP_URL=$(cat webapp-url.txt)" >> $GITHUB_ENV
            echo "Exported WEBAPP_URL"
          else
            echo "webapp-url.txt not found; skipping export"
          fi
